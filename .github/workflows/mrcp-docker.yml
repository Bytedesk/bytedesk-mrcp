name: Build MRCP Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '镜像版本号，例如 1.0.0'
        required: true
        default: '1.0.0'
      push_to_registry:
        description: '是否推送到镜像仓库'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

env:
  IMAGE_NAME: bytedesk/mrcp
  ALIYUN_IMAGE_NAME: registry.cn-hangzhou.aliyuncs.com/bytedesk/mrcp

jobs:
  build-and-push:
    name: Build and Push MRCP Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Ensure LFS objects are available
        run: git lfs pull

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event.inputs.push_to_registry != 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Login to Aliyun Docker Registry
        if: github.event.inputs.push_to_registry != 'false'
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME }}
            ${{ env.ALIYUN_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=bytedesk-mrcp
            org.opencontainers.image.description=MRCP server image with bundled runtime libraries
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          platforms: linux/amd64
          push: ${{ github.event.inputs.push_to_registry != 'false' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.ALIYUN_IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.ALIYUN_IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: MRCP v${{ steps.version.outputs.value }}
          body: |
            Docker 镜像已发布。

            Docker Hub:
            docker pull bytedesk/mrcp:${{ steps.version.outputs.value }}

            阿里云镜像仓库:
            docker pull registry.cn-hangzhou.aliyuncs.com/bytedesk/mrcp:${{ steps.version.outputs.value }}

            本镜像仅提供 linux/amd64 平台，因为仓库内置的 MRCP 可执行文件为 x86_64 ELF 二进制。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build summary
        run: |
          {
            echo "## MRCP Docker 镜像构建完成"
            echo ""
            echo "- 版本: ${{ steps.version.outputs.value }}"
            echo "- 平台: linux/amd64"
            echo "- Docker Hub: bytedesk/mrcp:${{ steps.version.outputs.value }}"
            echo "- 阿里云: registry.cn-hangzhou.aliyuncs.com/bytedesk/mrcp:${{ steps.version.outputs.value }}"
          } >> "$GITHUB_STEP_SUMMARY"
